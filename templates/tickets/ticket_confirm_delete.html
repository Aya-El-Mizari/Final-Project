{% extends 'base.html' %}
{% block title %}Delete Ticket{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card border-danger">
            <div class="card-header text-danger"><strong>Confirm Delete</strong></div>
            <div class="card-body">
                <p>Are you sure you want to delete <strong>"{{ ticket.title }}"</strong>?</p>
                <p class="text-muted small">This action cannot be undone.</p>
                <form method="post">
                    {% csrf_token %}
                    <button class="btn btn-danger">Yes, Delete</button>
                    <a href="{% url 'ticket_detail' ticket.pk %}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
